name: Ketryx change-impact review

# On every pull request Claude Code assesses the change's blast radius - which
# regulated code and which Ketryx-controlled items the diff touches - and posts
# a HIGH-RISK / LOW-RISK verdict as a PR comment. High-risk changes need a
# Change Request approval in Ketryx before merge; low-risk changes proceed with
# lightweight sign-off.
#
# Advisory only. The verdict is a comment, never a blocking check - the
# traceability gate in ketryx-pr-checks.yml is what blocks.
#
# Required repo config:
#   - variable  KETRYX_PROJECT     the Ketryx project (KXPRJ...)
#   - secret    KETRYX_API_KEY     Ketryx API key, for the MCP server
#   - secret    ANTHROPIC_API_KEY  for the Claude Code action
#
# Without ANTHROPIC_API_KEY the job short-circuits with a notice rather than
# failing, so it can never block a pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ketryx-change-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change-impact classification
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set on this repository - skipping the change-impact review."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude change-impact classification
        if: steps.preflight.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Bearer token for the Ketryx MCP server, expanded into
          # .github/mcp-config.json at runtime by Claude Code.
          KETRYX_API_KEY: ${{ secrets.KETRYX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are performing a risk-based change-impact assessment of pull
            request #${{ github.event.pull_request.number }} in the
            ${{ github.repository }} repository.

            This repository is the ClarityCRC Analysis Pipeline - the software
            component of a laboratory-developed test (LDT) that screens for
            colorectal cancer from a stool specimen. Oversight is CMS under
            CLIA, not FDA premarket review, so the controlling obligation is
            analytical validity before any patient result is released.

            The REGULATED scope is:
              - src/pipeline.js            marker quantification, sample-adequacy
                                           QC, accession identity, composite
                                           scoring and threshold, reporting,
                                           audit trail
              - src/release/*.ts           function-level design outputs whose
                                           specs live in their docblocks
              - design/requirements/*.md   requirements (RQ-CRC-*)
              - design/specs/*.md          software item specs (SPEC-PIPE-*)
              - design/risks/*.md          risks (RSK-CRC-*)
              - validation/**              test cases, protocols, executions
            Everything else (src/steps/** test plumbing, tools/**, README, CI
            config) is NON-regulated supporting material.

            The Ketryx project is `${{ vars.KETRYX_PROJECT }}` on
            https://demo.ketryx.com. You have a Ketryx MCP server available
            (tools prefixed `mcp__ketryx__`) - use it to trace the blast radius.
            This project is all-git: trace targets are git itemIds such as
            RQ-CRC-03, SPEC-PIPE-CLASSIFIER, RSK-CRC-03 and
            fn-assert-releasable, NOT Jira keys.

            Steps:
            1. Read the PR diff: `gh pr diff ${{ github.event.pull_request.number }}`.
            2. Determine which files fall inside the regulated scope above.
            3. For regulated files, trace the blast radius in Ketryx using
               mcp__ketryx__hybrid_search_items, mcp__ketryx__get_item_records
               and mcp__ketryx__resolve_references, scoped to project
               ${{ vars.KETRYX_PROJECT }}. Read the `itemFulfills` frontmatter
               of any touched spec, the `@itemFulfills:` docblock tags of any
               touched source, and the `@tests:` tags of any touched scenario -
               those are the trace edges.
            4. Classify the change:
               - HIGH-RISK if it changes behaviour that affects a released
                 result: the positivity threshold or classifier coefficients,
                 sample-adequacy QC criteria, marker quantification, accession
                 identity checks, the reportable range, result-report content or
                 limitations text, or the audit trail that gates release. Also
                 HIGH-RISK if it touches any item that a risk in the register
                 names as a risk control.
               - LOW-RISK if it is outside the regulated scope, or inside it but
                 demonstrably non-behavioural (comments, formatting, test-only
                 additions, docs) with no controlled-item impact.
               When uncertain, classify HIGH-RISK (fail safe).
            5. Call out explicitly if the change affects anything traced to
               RSK-CRC-03, the reagent-lot threshold-drift risk, which currently
               has NO risk control defined.
            6. Post ONE PR comment via
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
               structured as:
               - **Verdict: HIGH-RISK CHANGE** or **Verdict: LOW-RISK CHANGE**
               - **Why** - 2-4 bullets (files in/out of regulated scope, what
                 behaviour changed, blast radius)
               - **Traced impact** - the controlled Ketryx items affected, by id
                 and title (or "none traced yet")
               - **Required next step** - HIGH-RISK: "This change requires a
                 Change Request approval in Ketryx before merge/release." /
                 LOW-RISK: "Proceeds with standard review; no Change Request
                 required."

            Only assess what changed in this PR. Do not modify any files.
          claude_args: |
            --mcp-config .github/mcp-config.json
            --model sonnet
            --max-turns 60
            --allowedTools "mcp__ketryx__*,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
