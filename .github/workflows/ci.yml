name: CI

on:
  # Explicit version input - the reliable path for reporting against a
  # specific Ketryx version rather than Current Draft.
  workflow_dispatch:
    inputs:
      version:
        description: Ketryx version to report results against
        required: true
  push:
    branches: [main]
    # A tag push is NOT matched by `branches`. Without this, cutting the
    # release tag runs nothing and the Ketryx version sits in Draft with
    # zero executions.
    tags: ['v*']

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # Surfaced as env so the reporting step can test for its presence -
    # the secrets context is not available in a step-level `if`.
    env:
      KETRYX_API_KEY: ${{ secrets.KETRYX_API_KEY }}
      # Results must be pinned to a version; unpinned results do not appear.
      DEFAULT_KETRYX_VERSION: KXVSN01M00YD6Q3EMKSM0QTGWMMPB4X
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Run acceptance suite
        run: npm run test:report

      # The @tests tags live in the .feature sources, where the Ketryx repo scan
      # turns them into Test Case -> item trace links. Stripping them from the
      # runtime report makes executions attach to those Test Cases by scenario
      # identity, without creating duplicate bare AT links on the targets.
      - name: Strip trace tags from report
        run: |
          node -e "
            const fs = require('fs');
            const p = 'reports/cucumber.json';
            const r = JSON.parse(fs.readFileSync(p, 'utf8'));
            for (const feat of r) {
              for (const el of feat.elements || []) {
                el.tags = (el.tags || []).filter(t => !t.name.startsWith('@tests:'));
              }
            }
            fs.writeFileSync(p, JSON.stringify(r));
          "

      # Skipped until KETRYX_API_KEY exists, so CI stays green in the meantime.
      - name: Report test results to Ketryx
        if: ${{ always() && env.KETRYX_API_KEY != '' }}
        uses: Ketryx/ketryx-github-action@v1
        with:
          # Pin the instance explicitly - the action defaults to app.ketryx.com
          # (production), which is not where this demo lives.
          ketryx-url: https://demo.ketryx.com
          project: KXPRJ01M00WM7KTERDRXM4J4RZTEV2G
          api-key: ${{ secrets.KETRYX_API_KEY }}
          version: ${{ inputs.version || env.DEFAULT_KETRYX_VERSION }}
          commit-sha: ${{ github.sha }}
          test-cucumber-path: reports/cucumber.json
          # Distinct per suite - a shared build-name makes builds overwrite
          # each other and executions come back blank.
          build-name: crc-screening-acceptance

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber.json
